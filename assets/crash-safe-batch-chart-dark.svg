<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 80 820 320" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="title desc">
<title id="title">Bigger chunks are faster, with diminishing returns: 77x from 1 to 5,000 rows</title><desc id="desc">Throughput against chunk size on a log scale. 1 rows per chunk: 140 rows per second; 10 rows per chunk: 1,182 rows per second; 50 rows per chunk: 3,591 rows per second; 100 rows per chunk: 5,027 rows per second; 250 rows per chunk: 6,606 rows per second; 500 rows per chunk: 7,412 rows per second; 1,000 rows per chunk: 8,834 rows per second; 2,500 rows per chunk: 9,898 rows per second; 5,000 rows per chunk: 10,774 rows per second.</desc>
<rect width="820" height="400" rx="8" fill="#151c1f"/>
<text x="64" y="34" font-size="17" font-weight="600" fill="#f0efec">Bigger chunks are faster, with diminishing returns: 77x from 1 to 5,000 rows</text>
<text x="64" y="56" font-size="13" fill="#c3c2b7">Rows per second posting 20,000 transactions. Each chunk is one database transaction,</text>
<text x="64" y="74" font-size="13" fill="#c3c2b7">written together with its checkpoint. Median of 3 runs, which differed by under 3%.</text>
<line x1="64" y1="344.0" x2="772" y2="344.0" stroke="#383835" stroke-width="1"/>
<text x="56" y="348.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">0</text>
<line x1="64" y1="284.0" x2="772" y2="284.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="288.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">3K</text>
<line x1="64" y1="224.0" x2="772" y2="224.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="228.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">6K</text>
<line x1="64" y1="164.0" x2="772" y2="164.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="168.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">9K</text>
<line x1="64" y1="104.0" x2="772" y2="104.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="56" y="108.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">12K</text>
<text x="90.6" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1</text>
<text x="267.6" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">10</text>
<text x="391.4" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">50</text>
<text x="444.6" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<text x="515.1" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">250</text>
<text x="568.4" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">500</text>
<text x="621.7" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1,000</text>
<text x="692.1" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2,500</text>
<text x="745.4" y="362" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">5,000</text>
<text x="418" y="388" font-size="11" fill="#898781" text-anchor="middle">rows per chunk (log scale)</text>
<path d="M90.6,341.2 L267.6,320.4 L391.4,272.2 L444.6,243.5 L515.1,211.9 L568.4,195.8 L621.7,167.3 L692.1,146.0 L745.4,128.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="90.6" cy="341.2" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>1 rows per chunk: 140 rows/s (runs from 139 to 140)</title></circle>
<circle cx="267.6" cy="320.4" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>10 rows per chunk: 1,182 rows/s (runs from 1,180 to 1,204)</title></circle>
<circle cx="391.4" cy="272.2" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>50 rows per chunk: 3,591 rows/s (runs from 3,569 to 3,674)</title></circle>
<circle cx="444.6" cy="243.5" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>100 rows per chunk: 5,027 rows/s (runs from 4,990 to 5,103)</title></circle>
<circle cx="515.1" cy="211.9" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>250 rows per chunk: 6,606 rows/s (runs from 6,579 to 6,674)</title></circle>
<circle cx="568.4" cy="195.8" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>500 rows per chunk: 7,412 rows/s (runs from 7,344 to 7,419)</title></circle>
<circle cx="621.7" cy="167.3" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>1,000 rows per chunk: 8,834 rows/s (runs from 8,765 to 8,897)</title></circle>
<circle cx="692.1" cy="146.0" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>2,500 rows per chunk: 9,898 rows/s (runs from 9,862 to 10,010)</title></circle>
<circle cx="745.4" cy="128.5" r="4" fill="#3987e5" stroke="#151c1f" stroke-width="2"><title>5,000 rows per chunk: 10,774 rows/s (runs from 10,723 to 10,785)</title></circle>
<text x="90.6" y="315.2" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">140 rows/s</text>
<text x="90.6" y="329.2" font-size="11" fill="#c3c2b7" text-anchor="start">1 per chunk</text>
<text x="745.4" y="102.3" font-size="12" font-weight="600" fill="#f0efec" text-anchor="end">10,774 rows/s</text>
<text x="745.4" y="116.3" font-size="11" fill="#c3c2b7" text-anchor="end">5,000 per chunk, fastest tested</text>
<text x="578.4" y="219.1" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">7,412 rows/s</text>
<text x="578.4" y="233.1" font-size="11" fill="#c3c2b7" text-anchor="start">500 per chunk, the default</text>
</svg>
