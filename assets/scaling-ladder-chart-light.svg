<svg xmlns="http://www.w3.org/2000/svg" width="820" height="285" viewBox="0 110 820 285" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="title desc">
<title id="title">Five changes took the API from 1.3 to about 3,000 requests a second</title><desc id="desc">Capacity rose 2,290-fold. step 0, Baseline: 1.3 requests a second, p50 916 ms, p99 1,395 ms; step 1, Indexes: 128 requests a second, p50 22 ms, p99 35 ms; step 2, Connection pooling: 2,176 requests a second, p50 4.2 ms, p99 28 ms; step 3, Cache-aside: 3,840 requests a second, p50 5.2 ms, p99 14 ms; step 4, Stampede protection: 2,816 requests a second, p50 5.8 ms, p99 11 ms; step 5, Load balancing: 4,096 requests a second, p50 7.7 ms, p99 29 ms.</desc>
<rect width="820" height="700" rx="8" fill="#fcfcfb"/>
<text x="72" y="36" font-size="17" font-weight="600" fill="#0b0b0b">Five changes took the API from 1.3 to about 3,000 requests a second</text>
<text x="72" y="60" font-size="13" fill="#52514e">Each step is the one before plus one change, on one laptop (4 cores). Indexes and pooling did most of it;</text>
<text x="72" y="78" font-size="13" fill="#52514e">from step 3 the single API process, then the laptop itself, set the limit. Latency is one request at a time</text>
<text x="72" y="96" font-size="13" fill="#52514e">(0.5 a second), so it shows the work each request does, not queueing.</text>
<text x="72" y="130" font-size="13" font-weight="600" fill="#0b0b0b">Capacity, requests a second (log scale)</text>
<line x1="72" y1="336.0" x2="780" y2="336.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="64" y="340.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">1</text>
<line x1="72" y1="291.0" x2="780" y2="291.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64" y="295.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">10</text>
<line x1="72" y1="246.0" x2="780" y2="246.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64" y="250.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">100</text>
<line x1="72" y1="201.0" x2="780" y2="201.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64" y="205.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">1,000</text>
<line x1="72" y1="156.0" x2="780" y2="156.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64" y="160.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">10,000</text>
<text x="72" y="364" font-size="12" fill="#52514e">Steps 3 to 5 are within noise of each other. In repeated runs at fixed rates, each passed</text>
<text x="72" y="381" font-size="12" fill="#52514e">3,072 a second in at least 2 runs of 3, and none passed 4,096 even once.</text>
<path d="M131.0,330.7 L249.0,241.2 L367.0,185.8 L485.0,174.7 L603.0,180.8 L721.0,173.4" fill="none" stroke="#257de0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="131.0" cy="330.7" r="4.5" fill="#257de0" stroke="#fcfcfb" stroke-width="2"><title>Step 0, Baseline: 1.3 requests a second</title></circle>
<text x="131.0" y="318.7" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">1.3</text>
<circle cx="249.0" cy="241.2" r="4.5" fill="#257de0" stroke="#fcfcfb" stroke-width="2"><title>Step 1, Indexes: 128 requests a second</title></circle>
<text x="249.0" y="229.2" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">128</text>
<circle cx="367.0" cy="185.8" r="4.5" fill="#257de0" stroke="#fcfcfb" stroke-width="2"><title>Step 2, Connection pooling: 2,176 requests a second</title></circle>
<text x="367.0" y="173.8" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">2,176</text>
<circle cx="485.0" cy="174.7" r="4.5" fill="#257de0" stroke="#fcfcfb" stroke-width="2"><title>Step 3, Cache-aside: 3,840 requests a second</title></circle>
<text x="485.0" y="162.7" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">3,840</text>
<circle cx="603.0" cy="180.8" r="4.5" fill="#257de0" stroke="#fcfcfb" stroke-width="2"><title>Step 4, Stampede protection: 2,816 requests a second</title></circle>
<text x="603.0" y="168.8" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">2,816</text>
