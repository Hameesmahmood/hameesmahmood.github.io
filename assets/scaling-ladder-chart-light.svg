<text x="64" y="601.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">10</text>
<line x1="72" y1="552.0" x2="780" y2="552.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64" y="556.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">100</text>
<line x1="72" y1="507.0" x2="780" y2="507.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="64" y="511.0" font-size="11" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">1,000</text>
